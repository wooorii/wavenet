<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환수 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:#F2F4F6;color:#191F28;font:14px/1.5 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}

/* ---- 왼쪽 사이드바: 평소엔 아이콘만, 마우스를 올리면 펼쳐짐 ---- */
.side{position:fixed;left:0;top:0;bottom:0;width:64px;background:#fff;border-right:1px solid #E5E8EB;padding:14px 10px 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden;white-space:nowrap;transition:width .18s ease,box-shadow .18s ease;z-index:30}
.side:hover,.side:focus-within{width:224px;box-shadow:6px 0 18px rgba(0,0,0,.08)}
.brand-row{position:relative;height:50px;margin-bottom:12px;transition:height .18s ease;flex:0 0 auto}
.side:hover .brand-row,.side:focus-within .brand-row{height:112px}
.logo-mark,.logo-full{position:absolute;display:block;height:auto;pointer-events:none;transition:opacity .15s ease}
.logo-mark{left:1px;top:11px;width:42px;opacity:1}
.logo-full{left:27px;top:6px;width:150px;opacity:0}
.side:hover .logo-mark,.side:focus-within .logo-mark{opacity:0}
.side:hover .logo-full,.side:focus-within .logo-full{opacity:1}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 11px;border:0;border-radius:14px;background:none;color:#6B7684;font-size:15px;font-weight:500;text-align:left;flex:0 0 auto}
.nav-item:hover{background:#F2F4F6;color:#191F28}
.nav-item.active{background:#E8F3FF;color:#00294D;font-weight:800}
.ico{flex:0 0 22px;width:22px;height:22px}
.lbl{opacity:0;transition:opacity .15s ease}
.side:hover .lbl,.side:focus-within .lbl{opacity:1}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid #EEF0F3;flex:0 0 auto}
.who{font-size:12.5px;line-height:1.5;color:#6B7684;padding:4px 11px 8px}
.who b{color:#4E5968}

.wrap{margin-left:64px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:28;height:64px;background:#fff;border-bottom:1px solid #E5E8EB;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px}
.topbar .note{font-size:12.5px;line-height:1.4;color:#6B7684;min-width:0}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.topbar .brand img{height:30px;width:auto;display:block}
.topbar .brand b{font-size:16px;font-weight:800;letter-spacing:-.01em;color:#0B1B2B;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:32px 44px 64px;display:flex;flex-direction:column;gap:24px}

/* ---- 공통 컴포넌트 ---- */
.cap{font-size:14px;font-weight:500;color:#6B7684;margin-bottom:8px}
h1{margin:0;font-size:32px;line-height:1.35;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;color:#0B6BA8}
.sub{margin:10px 0 0;font-size:15px;color:#4E5968}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.btn-main{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border:0;border-radius:999px;background:#00294D;color:#fff;font-size:15px;font-weight:700}
.btn-main:hover{background:#0B3A66}
.btn-line{display:inline-flex;align-items:center;height:40px;padding:0 16px;border:1px solid #D9DEE5;border-radius:999px;background:#fff;font-size:14px;font-weight:700;color:#00294D}
.btn-line:hover{background:#F2F4F6}
.btn-small{height:32px;padding:0 12px;font-size:12.5px}
.btn-danger{color:#B42318}
.card{background:#fff;border-radius:24px;box-shadow:0 2px 14px rgba(25,31,40,.06)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.kpi{padding:22px 24px}
.kpi .l{font-size:13.5px;font-weight:500;color:#6B7684}
.kpi .v{font-size:32px;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.kpi .s{font-size:13px;color:#6B7684;margin-top:6px}
.kpi.navy{background:#00294D;color:#fff;box-shadow:0 2px 14px rgba(0,41,77,.18)}
.kpi.navy .l,.kpi.navy .s{color:#B9D4F0}
.red{color:#B42318}
.sec{font-size:16px;font-weight:800;margin:6px 0 12px}
.panel{padding:22px 8px 8px}
.panel-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:0 16px 16px}
.panel-h h3{margin:0;font-size:18px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border:0;border-radius:999px;background:#F2F4F6;color:#4E5968;font-size:13.5px;font-weight:700}
.chip.on{background:#00294D;color:#fff}
.chip small{opacity:.75;font-weight:500;font-size:13px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#F2F4F6;color:#6B7684}
.search input{border:0;background:transparent;outline:0;font-size:14px;color:#191F28;width:150px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12.5px;font-weight:500;color:#6B7684;text-align:center;padding:10px 12px;border-top:1px solid #EEF0F3;border-bottom:1px solid #EEF0F3;white-space:nowrap}
td{padding:0 12px;height:58px;border-bottom:1px solid #F2F4F6;text-align:center;font-size:14.5px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.l,th.l{text-align:left}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7FAFD}
tr.sel td{background:#EEF6FF}
tr.tot td{background:#F7F8FA;font-weight:800}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-red{background:#FDE8E8;color:#B42318}.b-amber{background:#FFF0D6;color:#9A5B00}.b-green{background:#DDF5E6;color:#067647}.b-gray{background:#EDEFF2;color:#4E5968}.b-sky{background:#E3F3FC;color:#0B5E8C}
.old{color:#B42318;font-weight:800}
.muted{color:#6B7684}.small{font-size:12.5px}
.banner{background:#FFF8E1;border-radius:16px;padding:12px 16px;font-weight:700;text-align:center;color:#3B3000}
.empty{padding:30px;text-align:center;color:#6B7684}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select,input[type=text],input[type=number],input[type=date]{height:44px;border:1px solid #D9DEE5;border-radius:12px;padding:0 12px;font-size:14.5px;background:#fff;color:#191F28;min-width:0}
label.f{display:block;font-size:12.5px;color:#6B7684;margin-bottom:4px}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.grid-f select,.grid-f input{width:100%}
.form{padding:22px 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{padding:16px 18px}
.tile .n1{font-size:12.5px;font-weight:700;color:#6B7684}
.tile .n2{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.tile .n2 small{font-size:15px;margin-left:2px}
.tile .n3{font-size:12.5px;color:#6B7684;margin-top:2px}
.tile.done{background:#E9F7EF}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.main{flex:999 1 620px;min-width:0}
.split>.side2{flex:1 1 340px;min-width:300px;padding:24px}
.steps{display:flex;gap:3px;min-width:110px}
.steps i{flex:1;height:6px;border-radius:99px;background:#DDE2E8}
.tl{position:relative;padding:0 0 18px 30px}
.tl:before{content:"";position:absolute;left:7px;top:20px;bottom:-14px;width:2px;background:#DDE2E8}
.tl.last:before{display:none}
.tl .dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:99px;box-sizing:border-box}
.tl .t{font-size:14.5px;font-weight:600}
.tl .t.cur{font-weight:800}
.tl .d{font-size:12.5px;color:#6B7684;margin-top:2px}
.drop{border:2px dashed #7AA7D1;border-radius:20px;background:#F3F9FF;padding:34px;text-align:center;cursor:pointer}
.warn{color:#9A5B00;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#00294D;color:#fff;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg{background:#fff;border-radius:24px;padding:26px;width:min(460px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 14px;font-size:20px}
@media (max-width:760px){main{padding:18px 18px 48px}h1{font-size:26px}.topbar{padding:0 16px}.topbar .note{display:none}.topbar .brand{margin-left:auto}}

/* ---- 로그인 ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F2F4F6}
.login-card{background:#fff;border-radius:28px;box-shadow:0 8px 30px rgba(25,31,40,.10);padding:38px 32px 30px;width:min(400px,100%)}
.login-card img{display:block;width:150px;height:auto;margin:0 auto 22px}
.login-card h1{font-size:22px;text-align:center;margin:0 0 4px}
.login-card p.hint{text-align:center;color:#6B7684;font-size:13.5px;margin:0 0 20px}
.login-card label{display:block;font-size:12.5px;color:#6B7684;margin:12px 0 4px}
.login-card input{width:100%}
.login-card .btn-main{width:100%;justify-content:center;margin-top:20px}
.err{color:#B42318;font-size:13px;margin:12px 0 0;text-align:center}
.foot-note{color:#6B7684;font-size:12.5px;text-align:center;margin-top:18px;line-height:1.6}
/* ---- 세금계산서 상태 ---- */
.seg{display:inline-flex;gap:4px;background:#F2F4F6;border-radius:999px;padding:4px}
.seg button{border:0;height:38px;padding:0 18px;border-radius:999px;background:transparent;font-size:14px;font-weight:700;color:#4E5968}
.seg button:disabled{cursor:default}
.seg button.s0.on{background:#FDE8E8;color:#B42318}
.seg button.s1.on{background:#E3F3FC;color:#0B5E8C}
.seg button.s2.on{background:#DDF5E6;color:#067647}
.taxsel{height:32px;border-radius:999px;border:0;padding:0 8px;font-size:12.5px;font-weight:700;min-width:84px;text-align-last:center;cursor:pointer}
.taxsel.t0{background:#FDE8E8;color:#B42318}
.taxsel.t1{background:#E3F3FC;color:#0B5E8C}
.taxsel.t2{background:#DDF5E6;color:#067647}
.logline{font-size:13px;color:#4E5968;padding:3px 0}
.logline b{color:#191F28}
.notice{background:#FFF8E1;border-radius:16px;padding:14px 18px;font-size:14px;color:#3B3000;line-height:1.6}
.pagehead-note{font-size:12.5px;color:#6B7684}

/* ---- 전체현황 표 머리 필터 (세무 · 법률진행) ---- */
.hf{height:30px;border:1px solid #D9DEE5;border-radius:999px;padding:0 8px;font-size:12.5px;font-weight:700;background:#fff;color:#00294D;cursor:pointer}
.hf.on{background:#E8F3FF;border-color:#26A9E0}
.filter-note{padding:0 16px 10px;font-size:12.5px;color:#6B7684}
.filter-note a{color:#0B6BA8;font-weight:700;margin-left:10px}
/* ---- 업체조회: 뒤로 가기 ---- */
.titlerow{display:flex;align-items:center;gap:12px}
.back{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid #D9DEE5;background:#fff;color:#00294D;display:inline-flex;align-items:center;justify-content:center}
.back:hover{background:#F2F4F6}
/* ---- 업체조회: 정산 흐름 + 남은 환수금 ---- */
.flowwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.flowcard{flex:1.7 1 540px;min-width:0;padding:22px 22px 18px}
.flowrow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.fl{flex:1 1 120px;min-width:112px;background:#F7F9FB;border-radius:16px;padding:14px}
.fl-l{font-size:12.5px;color:#6B7684;font-weight:500}
.fl-v{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.02em;white-space:nowrap}
.fl-s{font-size:12px;color:#6B7684;margin-top:4px;line-height:1.4}
.fl-op{align-self:center;font-size:22px;font-weight:700;color:#8A94A3;flex:0 0 auto}
.flowhint{font-size:12.5px;color:#6B7684;margin-top:14px}
.remain{flex:1 1 300px;min-width:0;background:#0B1F3A;color:#fff;border-radius:24px;padding:24px 26px;box-shadow:0 6px 20px rgba(11,31,58,.28)}
.rm-l{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:#B9D4F0}
.rm-v{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1.1}
.rm-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:18px;overflow:hidden}
.rm-bar i{display:block;height:100%;border-radius:99px;background:#26A9E0}
.rm-s{font-size:13px;color:#B9D4F0;margin-top:10px;line-height:1.5}
.rm-done{color:#7AE0A6;font-weight:700}
.rm-total{border-top:1px solid rgba(255,255,255,.16);margin-top:16px;padding-top:12px;font-size:13px;color:#B9D4F0}
.rm-total b{color:#fff}

/* ---- Notice: 업체별 메모 (오른쪽 여백, 본문 영역을 침범하지 않음) ---- */
.notice-dock{position:fixed;top:76px;right:0;width:300px;max-height:calc(100vh - 92px);z-index:25;transform:translateX(100%);transition:transform .2s ease;display:flex}
.notice-dock.open{transform:none}
.notice-dock.hide{display:none}
.notice-tab{position:absolute;left:-40px;top:24px;width:40px;padding:14px 0;border:1px solid #E5E8EB;border-right:0;border-radius:12px 0 0 12px;background:#fff;color:#00294D;font-size:13px;font-weight:800;writing-mode:vertical-rl;letter-spacing:.08em;box-shadow:-3px 3px 10px rgba(0,0,0,.08)}
.notice-card{display:flex;flex-direction:column;width:100%;min-height:0;max-height:calc(100vh - 92px);background:#fff;border:1px solid #E5E8EB;border-radius:18px 0 0 18px;padding:16px;box-shadow:-6px 6px 20px rgba(0,0,0,.10)}
.notice-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;flex:0 0 auto}
.notice-h b{font-size:15px}
.notice-p{font-size:12.5px;font-weight:700;color:#4E5968}
.notice-card textarea{flex:0 0 auto;width:100%;height:110px;resize:vertical;border:0;border-radius:12px;background:#F2F4F6;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.6;color:#191F28;outline:0}
.notice-card textarea:focus{box-shadow:0 0 0 2px #B9D4F0}
.notice-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex:0 0 auto}
.notice-meta{font-size:12px;color:#6B7684;min-width:0}
.notice-meta b{color:#191F28}
.btn-small.btn-main{height:34px;padding:0 16px;font-size:13px}
.notice-list-h{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;font-size:13px;font-weight:800;color:#191F28;flex:0 0 auto}
.notice-list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:60px;flex:1 1 auto}
.nitem{background:#F2F4F6;border-radius:12px;flex:0 0 auto}
.nhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 12px;text-align:left;color:#191F28;font-size:13px}
.ndept{flex:0 0 auto;background:#fff;color:#00294D;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.ndate{flex:0 0 auto;color:#6B7684;font-size:12px}
.nprev{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4E5968}
.nchev{flex:0 0 auto;display:inline-flex;color:#6B7684;transition:transform .15s}
.nitem.open .nchev{transform:rotate(90deg)}
.nitem.open .nprev{display:none}
.nitem.open .nhead{flex-wrap:wrap}
.nbody{display:none;padding:0 12px 12px;font-size:13.5px;line-height:1.6;color:#191F28;white-space:pre-wrap;word-break:break-word}
.nitem.open .nbody{display:block}
.nby{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:11.5px;color:#6B7684}
.lnk.danger{color:#B42318}
.notice-tip{margin:12px 0 0;font-size:11.5px;line-height:1.5;color:#6B7684;flex:0 0 auto}
@media (min-width:1860px){
  .notice-dock{right:10px;width:260px;transform:none}
  .notice-tab{display:none}
  .notice-card{border-radius:18px}
}
/* ---- 법률진행: 이력 메모 수정 ---- */
.lnk{border:0;background:none;color:#0B6BA8;font-weight:700;font-size:12.5px;padding:0 4px;cursor:pointer}
.lnk.gray{color:#6B7684}
.lnk:hover{text-decoration:underline}
.edited{display:inline-block;font-size:11.5px;color:#9A5B00;background:#FFF0D6;border-radius:6px;padding:1px 6px;font-weight:700}
.evin{height:32px;width:min(220px,100%);border:1px solid #B9D4F0;border-radius:8px;padding:0 8px;font-size:13px}

/* ---- 전체현황 머리: 환수 진행 중 업체 ---- */
.head-r{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:10px;background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 2px 14px rgba(25,31,40,.06)}
.stat-l{font-size:13px;color:#6B7684;font-weight:500}
.stat-v{font-size:22px;font-weight:800;color:#00294D;letter-spacing:-.02em}
.stat-v small{font-size:14px;margin-left:2px;color:#4E5968;font-weight:700}

/* ---- 계정 관리: 비밀번호 전달 창 ---- */
.pwbox{background:#F2F4F6;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.9;word-break:break-all}
.pwbox b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.03em}

/* ---- 업무 요청: 알림(종) + 메모 안의 요청 표시 ---- */
.notice-btns{display:inline-flex;gap:8px}
.notice-f{flex-wrap:wrap}
.nreq-chip{flex:0 0 auto;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800;white-space:nowrap}
.nreq-chip.rs-0{background:#FDE8E8;color:#B42318}
.nreq-chip.rs-1{background:#FFF0D6;color:#9A5B00}
.nreq-chip.rs-2{background:#DDF5E6;color:#067647}
.nitem .nhead{flex-wrap:wrap}
.nreq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;font-size:12.5px;color:#4E5968}
.nreq-act{display:flex;gap:8px;margin-top:10px}
.bell-wrap{position:relative;display:inline-flex;align-items:center}
.top-r{display:flex;align-items:center;gap:16px;flex:0 0 auto}
.bell-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid #E5E8EB;background:#fff;color:#00294D;display:inline-flex;align-items:center;justify-content:center}
.bell-btn:hover{background:#F2F4F6}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#D92D20;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-sizing:border-box}
.bell-panel{position:absolute;right:0;top:52px;width:380px;max-width:calc(100vw - 24px);max-height:72vh;overflow:auto;background:#fff;border:1px solid #E5E8EB;border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:14px}
.bp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bp-h b{font-size:15px}
.rq{background:#F2F4F6;border-radius:14px;margin-bottom:8px;overflow:hidden}
.rq-main{display:block;width:100%;border:0;background:none;text-align:left;padding:12px 14px 6px;color:#191F28}

const COL = { no: 0, kind: 1, cust: 2, prod: 4, opt: 5, partner: 8, open: 11, amt: 24, settle: 25, note: 27 };
function pad2(n){ return String(n).padStart(2, "0"); }
function toISO(v){
  if (v == null || v === "") return "";
  if (v instanceof Date) return v.getFullYear() + "-" + pad2(v.getMonth() + 1) + "-" + pad2(v.getDate());
  if (typeof v === "number" && isFinite(v)){
    if (v < 30000 || v > 90000) return "";
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 86400000);
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }
  const m = String(v).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? m[1] + "-" + pad2(+m[2]) + "-" + pad2(+m[3]) : "";
}
function stripMarks(s){ return String(s == null ? "" : s).replace(/[■□▪▫●○◎◆◇▲△]/g, "").trim(); }
function maskName(n, style){
  const ch = Array.from(String(n == null ? "" : n).trim());
  if (!ch.length) return "";
  if (ch.length === 1) return ch[0];
  if (style === "middle") return ch.length === 2 ? ch[0] + "○" : ch[0] + "○".repeat(ch.length - 2) + ch[ch.length - 1];
  return ch[0] + "○○";
}
/* 연락처: 뒤 4자리를 가려서 010-5555-○○○○ 형태로 (입력한 전체 번호는 저장하지 않음) */
function maskPhone(v){
  const s = String(v == null ? "" : v).trim();
  if (!s) return "";
  if (/[○*Xx●]/.test(s) && s.replace(/\D/g, "").length >= 5) return s.replace(/[*Xx●○]+$/, "○○○○");
  const d = s.replace(/\D/g, "");
  if (d.length < 8) return "";
  const keep = d.slice(0, -4);
  const head = keep.startsWith("02") ? keep.slice(0, 2) + "-" + keep.slice(2) : keep.slice(0, 3) + "-" + keep.slice(3);
  return head + "-○○○○";
}
function cleanNote(n){ return String(n == null ? "" : n).replace(/0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4}/g, "[번호]").trim(); }
function parseNote(note, settleISO){
  const t = String(note == null ? "" : note);
  const y0 = settleISO ? +settleISO.slice(0, 4) : new Date().getFullYear();
  const validDate = (yy, mm, dd) => {
    const y = 2000 + yy;
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
    const d = new Date(Date.UTC(y, mm - 1, dd));
    if (d.getUTCMonth() !== mm - 1) return "";
    if (y > y0 + 1 || y < y0 - 3) return "";
    return y + "-" + pad2(mm) + "-" + pad2(dd);
  };
  let term = "", rate = null;
  const m = t.match(/(?:^|\D)(\d{2})(\d{2})(\d{2})(?!\d)\s*해지/);
  if (m) term = validDate(+m[1], +m[2], +m[3]);
  if (!term){
    const re = /(?:^|\D)(\d{2})(\d{2})(\d{2})(?!\d)/g; let k;
    while ((k = re.exec(t))){ const v = validDate(+k[1], +k[2], +k[3]); if (v){ term = v; break; } }
  }
  const r = t.match(/(\d{1,3}(?:\.\d+)?)\s*%/);
  if (r){ const x = parseFloat(r[1]); if (x >= 0 && x <= 100) rate = x; }
  return { term, rate };
}
/* 정산내역서(엑셀)에서 읽은 행 -> 정산서별 요약 + 환수 건. 고객명은 가리고, 가입서비스(회선·가입번호) 열은 읽지 않음 */
function extractFromRows(rows, fileName, maskStyle){
  let hdrOK = false;
  for (let i = 0; i < Math.min(rows.length, 4); i++){
    const r = rows[i] || [];
    if (String(r[COL.amt] == null ? "" : r[COL.amt]).includes("정산금액") && String(r[COL.settle] == null ? "" : r[COL.settle]).includes("정산예정")){ hdrOK = true; break; }
  }
  if (!hdrOK) throw new Error("정산내역서 양식이 아닙니다. (정산금액·정산예정일 열 위치가 다릅니다)");
  const tm = String(fileName || "").match(/(정발행|역발행|원천세)/);
  const fileTax = tm ? tm[1] : "";
  const groups = new Map(); const skipped = [];
  for (const r of rows){
    if (!r) continue;
    const kind = String(r[COL.kind] == null ? "" : r[COL.kind]).trim();
    if (kind !== "일반" && kind !== "환수") continue;
    const partner = stripMarks(r[COL.partner]);
    const settle = toISO(r[COL.settle]);
    const amt = r[COL.amt] == null || r[COL.amt] === "" ? 0 : Number(r[COL.amt]);
    if (!partner || !settle || !isFinite(amt)){ skipped.push("번호 " + (r[COL.no] == null ? "?" : r[COL.no]) + ": 업체·정산예정일·정산금액 중 빈 값이 있어 제외했습니다."); continue; }
    const key = partner + "|" + settle;
    if (!groups.has(key)) groups.set(key, { partner, settleDate: settle, taxType: fileTax, normalSum: 0, normalCount: 0, clawSum: 0, lines: [], warnings: [] });
    const g = groups.get(key);
    if (kind === "일반"){ g.normalSum += amt; g.normalCount++; continue; }
    if (amt > 0) g.warnings.push("번호 " + r[COL.no] + ": 환수 건인데 정산금액이 양수입니다. 확인해 주세요.");
    const note = cleanNote(r[COL.note]);
    const pn = parseNote(note, settle);
    if (!pn.term) g.warnings.push("번호 " + r[COL.no] + ": 비고에서 해지일을 찾지 못했습니다. 아래에서 직접 입력하세요.");
    if (pn.rate == null) g.warnings.push("번호 " + r[COL.no] + ": 비고에서 환수율을 찾지 못했습니다. 아래에서 직접 입력하세요.");
    g.clawSum += -amt;
    g.lines.push({
      src_no: Number(r[COL.no]) || null,
      customer_mask: maskName(r[COL.cust], maskStyle),
      product: [r[COL.prod], r[COL.opt]].filter(x => x != null && String(x).trim() !== "").map(x => String(x).trim()).join(" / "),
      open_date: toISO(r[COL.open]),
      term_date: pn.term, rate_pct: pn.rate, amount: -amt, note
    });
  }
  const list = Array.from(groups.values());
  if (!list.length) throw new Error("'일반' 또는 '환수' 행을 찾지 못했습니다.");
  list.forEach(g => { g.warnings = skipped.concat(g.warnings); });
  return list;
}
function daysBetween(fromISO, toISOv){
  const a = Date.UTC(+fromISO.slice(0, 4), +fromISO.slice(5, 7) - 1, +fromISO.slice(8, 10));
  const b = Date.UTC(+toISOv.slice(0, 4), +toISOv.slice(5, 7) - 1, +toISOv.slice(8, 10));
  return Math.round((b - a) / 86400000);
}
function statusOf(carry, ded, pay){
  if (carry === 0) return "상계완료";
  const done = ded + pay;
  if (done > carry) return "초과처리 확인";
  if (carry - done === 0) return "회수완료";
  return done > 0 ? "일부회수" : "이월중";
}
function taxFactor(type, cfg){ return type === "원천세" ? 1 - cfg.WITHHOLDING : 1 + cfg.VAT; }
function computeRows(statements, lines, actions, taxRows, todayISO){
  const lmap = new Map(), amap = new Map(), tmap = new Map();
  lines.forEach(l => { if (!lmap.has(l.statement_id)) lmap.set(l.statement_id, []); lmap.get(l.statement_id).push(l); });
  actions.forEach(a => { const k = a.partner + "|" + a.settle_date; if (!amap.has(k)) amap.set(k, []); amap.get(k).push(a); });
  (taxRows || []).forEach(t => tmap.set(t.partner + "|" + t.settle_date, t));
  return statements.map(s => {
    const key = s.partner + "|" + s.settle_date;
    const acts = amap.get(key) || [];
    const ded = acts.filter(a => a.kind === KIND_DED).reduce((t, a) => t + Number(a.amount), 0);
    const pay = acts.filter(a => a.kind === KIND_PAY).reduce((t, a) => t + Number(a.amount), 0);
    const claw = Number(s.claw_sum), normal = Number(s.normal_sum);
    const carry = Math.max(0, claw - normal), unresolved = Math.max(0, carry - ded - pay);
    const tx = tmap.get(key);
    return Object.assign({}, s, {
      claw_sum: claw, normal_sum: normal, carry, ded, pay, unresolved,
      status: statusOf(carry, ded, pay),
      age: unresolved > 0 ? daysBetween(s.settle_date, todayISO) : null,
      tax_status: s.tax_type === "원천세" ? "미해당" : (tx ? tx.status : "미처리"), tax_by: tx ? tx.updated_by : "", tax_at: tx ? tx.updated_at : "",
      lines: (lmap.get(s.id) || []).slice().sort((a, b) => (a.src_no || 0) - (b.src_no || 0))
    });
  });
}
function buildCases(cases, events, rows, todayISO){
  const evBy = new Map();
  events.forEach(e => { if (!evBy.has(e.case_id)) evBy.set(e.case_id, []); evBy.get(e.case_id).push(e); });
  return cases.map(c => {

  });
}

}

async function fetchAll(table, orderCol){
  let all = [], from = 0; const size = 1000;
  for (;;){
    const { data, error } = await S.sb.from(table).select("*").order(orderCol || "id", { ascending: true }).range(from, from + size - 1);
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < size) break;
    from += size;
  }
  return all;
}
async function fetchOptional(table, orderCol){ try { return { ok: true, data: await fetchAll(table, orderCol) }; } catch (e) { return { ok: false, data: [] }; } }

async function boot(){
  const live = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY;
  if (!live){
    S.mode = "demo"; API = makeDemoAPI(); S.user = null; S.role = null; S.member = null;
    renderLogin(); return;
  }
  if (!window.supabase){ $("#root").innerHTML = '<div class="login-wrap"><div class="login-card"><h1>연결 오류</h1><p class="err">Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 회사 보안 설정을 확인하세요.</p></div></div>'; return; }
  S.mode = "live"; API = makeLiveAPI();
  S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: false } });
  const { data } = await S.sb.auth.getSession();
  await afterSession(data.session);
  S.sb.auth.onAuthStateChange((ev, sess) => { const uid = sess && sess.user ? sess.user.id : null; if (uid !== S.uid) afterSession(sess); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.role) scheduleReload(); });
}
async function afterSession(session){
  S.uid = session && session.user ? session.user.id : null;
  if (!session){ S.user = null; S.role = null; S.member = null; renderLogin(); return; }
  S.user = session.user;
  const { data, error } = await S.sb.from("members").select("*").eq("email", String(session.user.email || "").toLowerCase()).maybeSingle();
  if (error || !data){ renderDenied(); return; }
  S.role = data.role; S.member = data;
  try { await reload(); } catch (e) { $("#root").innerHTML = '<div class="login-wrap"><div class="login-card"><h1>데이터 오류</h1><p class="err">' + esc(e.message) + "</p></div></div>"; return; }
  subscribeRealtime(); renderApp();
}
function subscribeRealtime(){
  if (S.channel) return;
  try {
    S.channel = S.sb.channel("db-changes");
    const tables = ["statements", "clawback_lines", "actions", "members"];
    if (S.taxOK) tables.push("tax_status", "tax_status_log");
    if (S.legalOK && can.legal()) tables.push("legal_cases", "legal_events");

/* ---------- 완료 축하 효과 ---------- */
let celeStop = null, celeTimer = 0;
function launchConfetti(canvas, ms){
  const g = canvas.getContext && canvas.getContext("2d"); if (!g) return null;
  const dpr = window.devicePixelRatio || 1, W = canvas.width = Math.round((window.innerWidth || 1200) * dpr), H = canvas.height = Math.round((window.innerHeight || 800) * dpr);
  const colors = ["#26A9E0", "#00294D", "#FFD84D", "#7AE0A6", "#FF8FAB", "#FFFFFF"];
  const parts = [];
  for (let i = 0; i < 170; i++){
    const burst = i < 90;
    parts.push({ x: burst ? W / 2 : Math.random() * W, y: burst ? H * 0.56 : -Math.random() * H * 0.4,
      vx: (burst ? (Math.random() - 0.5) * 22 : (Math.random() - 0.5) * 2.5) * dpr, vy: (burst ? -(9 + Math.random() * 13) : 2 + Math.random() * 3) * dpr,
      w: (6 + Math.random() * 7) * dpr, h: (9 + Math.random() * 9) * dpr, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, c: colors[i % colors.length], sw: Math.random() * 6.28 });
  }
  const t0 = Date.now(); let raf = 0, alive = true;
  const tick = () => {
    const el = Date.now() - t0; g.clearRect(0, 0, W, H); g.globalAlpha = Math.max(0, Math.min(1, (ms - el) / 800));
    parts.forEach(p => { p.vy += 0.32 * dpr; p.vx *= 0.992; p.x += p.vx + Math.sin(p.sw += 0.05) * 0.8 * dpr; p.y += p.vy; p.rot += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); });
    if (alive && el < ms) raf = requestAnimationFrame(tick); else g.clearRect(0, 0, W, H);
  };
  raf = requestAnimationFrame(tick);
  return () => { alive = false; cancelAnimationFrame(raf); g.clearRect(0, 0, W, H); };
}
function closeCelebrate(){ clearTimeout(celeTimer); if (celeStop){ celeStop(); celeStop = null; } const c = $("#celebrate"); if (c) c.innerHTML = ""; }
function celebrate(partner, amount){
  const c = $("#celebrate"); if (!c) return;
  closeCelebrate();
  const calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  c.innerHTML = (calm ? "" : '<canvas aria-hidden="true"></canvas>') + '<div class="cele-card" role="status" aria-live="polite"><div class="cele-check"><svg viewBox="0 0 52 52" width="52" height="52" fill="none" stroke="#067647" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 27l8 8 16-17"/></svg></div><h3>환수 완료!</h3><p>' + esc(partner) + '의 환수금을 모두 회수했어요.<span class="cele-amt">' + won(amount) + '</span>수고하셨어요.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn-main" style="height:42px" data-act="celeclose">닫기</button></div></div>';
  const cv = !calm && c.querySelector ? c.querySelector("canvas") : null;
  if (cv) celeStop = launchConfetti(cv, 3800);
  celeTimer = setTimeout(closeCelebrate, 7000);
}

const xlName = (s, fallback) => String(s || fallback).replace(/[\\\/\?\*\[\]:]/g, "_").slice(0, 31) || fallback;
function partnerSheets(partner){
  const rows = S.rows.filter(r => r.partner === partner).sort((a, b) => a.settle_date < b.settle_date ? 1 : a.settle_date > b.settle_date ? -1 : 0);
  const phone = S.phoneOK, blank = n => Array(n).fill("");

  const rightHead = ["정산일", "세무유형", "세금계산서", "환수건수", "환수금", "일반정산금", "이월잔액", "차감 반영", "입금 확인", "미해결 잔액", "상태", "경과일"];
  const left = [], right = [];

  rows.forEach(r => right.push([r.settle_date, r.tax_type, r.tax_status, r.lines.length, r.claw_sum, r.normal_sum, r.carry, r.ded, r.pay, r.unresolved, r.status, r.age == null ? "" : r.age]));
  const amtL = leftHead.indexOf("환수금액"), L = leftHead.length, R0 = L + 1;      // 가운데 1열은 빈 칸(여백)
  const sum = (arr, i) => arr.reduce((t, x) => t + (Number(x[i]) || 0), 0);
  const n = Math.max(left.length, right.length), aoa = [];
  aoa.push([partner + " 환수 현황"]);
  aoa.push(["내려받은 날짜 " + todayISO()]);

  for (let i = 0; i < n; i++) aoa.push((left[i] || blank(L)).concat([""], right[i] || []));

  const tr = blank(rightHead.length); tr[0] = "합계"; [3, 4, 5, 6, 7, 8, 9].forEach(i => { tr[i] = sum(right, i); });

  const money = [amtL, R0 + 4, R0 + 5, R0 + 6, R0 + 7, R0 + 8, R0 + 9];
  const sheets = [{ name: xlName(partner, "업체"), aoa, cols, money, firstData: 5 }];
  const acts = S.actions.filter(a => a.partner === partner).sort((a, b) => a.action_date < b.action_date ? 1 : -1);
  sheets.push({ name: "처리기록", aoa: [["처리일", "환수발생일", "구분", "금액", "확인 부서", "메모", "입력자"]].concat(acts.map(a => [a.action_date, a.settle_date, a.kind, Number(a.amount), a.dept || "", a.memo || "", uid(a.created_by) || ""])), cols: [12, 12, 14, 13, 14, 36, 28].map(w => ({ wch: w })), money: [3], firstData: 1 });
  const nts = (S.notes[partner] || []).slice().sort((a, b) => a.at < b.at ? 1 : -1);
  sheets.push({ name: "Notice", aoa: [["작성일시", "작성 부서", "내용", "작성자", "요청 부서", "요청 상태", "기한"]].concat(nts.map(x => [dtLocal(x.at), x.dept || "", x.body, uid(x.by) || "", x.to_dept || "", x.req_status || "", x.due || ""])), cols: [18, 14, 60, 28, 14, 10, 12].map(w => ({ wch: w })), money: [], firstData: 1 });
  if (S.legalOK && can.legal()){
    const cs = buildCases(S.cases, S.events, S.rows, todayISO()).filter(c => c.partner === partner);

function exportPartner(partner){

function genPassword(){
  const set = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", cr = typeof crypto !== "undefined" ? crypto : window.crypto;
  for (;;){ const buf = new Uint32Array(12); cr.getRandomValues(buf); let p = ""; for (const n of buf) p += set[n % set.length]; if (/[A-Z]/.test(p) && /[a-z]/.test(p) && /[0-9]/.test(p)) return p; }
}

function exportXlsx(){
  if (!window.XLSX){ toast("엑셀 라이브러리를 불러오지 못했습니다.", true); return; }
  const y = ($("#xy") || {}).value || "";
  const rows = S.rows.filter(r => !y || r.settle_date.startsWith(y));
  const keys = new Set(rows.map(r => r.partner + "|" + r.settle_date));
  const sum = rows.map(r => ({ 정산일: r.settle_date, 업체: r.partner, 세무유형: r.tax_type, 세금계산서: r.tax_status, 환수건수: r.line_count, 환수금: r.claw_sum, 일반정산금: r.normal_sum, 이월잔액: r.carry, 차감반영: r.ded, 입금확인: r.pay, 미해결잔액: r.unresolved, 상태: r.status }));
  const det = []; rows.forEach(r => r.lines.forEach(l => det.push({ 정산일: r.settle_date, 업체: r.partner, 번호: l.src_no, 고객: l.customer_mask, 연락처: l.phone_mask || "", 상품: l.product, 개통일: l.open_date, 해지일: l.term_date, 환수율: l.rate_pct, 환수금액: l.amount, 비고: l.note })));
  const act = S.actions.filter(a => keys.has(a.partner + "|" + a.settle_date)).map(a => ({ 처리일: a.action_date, 업체: a.partner, 환수발생일: a.settle_date, 구분: a.kind, 금액: a.amount, 확인부서: a.dept, 메모: a.memo, 입력자: uid(a.created_by) }));
  const tl = S.taxLog.filter(l => keys.has(l.partner + "|" + l.settle_date)).map(l => ({ 변경일시: l.changed_at, 업체: l.partner, 정산일: l.settle_date, 이전: l.from_status, 이후: l.to_status, 변경자: uid(l.changed_by) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sum), "정산서현황");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(det), "환수건상세");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(act), "처리기록");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tl), "세금계산서이력");
  if (can.legal() && S.legalOK){
    const lg = buildCases(S.cases, S.events, S.rows, todayISO()).filter(c => keys.has(c.partner + "|" + c.settle_date)).map(c => ({ 업체: c.partner, 정산일: c.settle_date, 사유: c.reason, 단계: STAGES[c.stage], 금액: c.amount, 다음일정: c.next_label, 다음일정일: c.next_date, 이력: c.hist.map(e => e.date + " " + e.title + (e.note ? "(" + e.note + ")" : "")).join(" / ") }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lg), "법률진행");
  }
  XLSX.writeFile(wb, "환수관리_" + (y || "전체") + "_" + todayISO() + ".xlsx");
}

    else if (a === "passok"){
      const p1 = $("#np1").value || "", p2 = $("#np2").value || "";
      if (p1.length < CONFIG.MIN_PASSWORD){ toast("비밀번호는 " + CONFIG.MIN_PASSWORD + "자 이상이어야 해요.", true); return; }
      if (p1 !== p2){ toast("비밀번호 확인이 맞지 않아요.", true); return; }
      if (S.mode === "demo"){ closeModal(); toast("미리보기에서는 비밀번호를 바꾸지 않아요."); return; }
      const { error } = await S.sb.auth.updateUser({ password: p1 });
      if (error){ toast("변경하지 못했어요: " + error.message, true); return; }
      closeModal(); toast("비밀번호를 바꿨어요.");
    }
  } catch (err){ toast(err.message || String(err), true); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.tax){ await changeTax(t.dataset.p, t.dataset.d, t.value); return; }
  if (t.id === "vp"){ S.sel.partner = t.value; S.sel.date = ""; renderTab(); }
  else if (t.id === "vd"){ S.sel.date = t.value; renderTab(); }
  else if (t.id === "ftaxtype"){ S.f.tax = t.value; $("#ovTable").innerHTML = overviewTable(); }
  else if (t.id === "flegal"){ S.f.legal = t.value; $("#ovTable").innerHTML = overviewTable(); }
  else if (t.id === "fop"){ S.f.open = t.checked; $("#ovTable").innerHTML = overviewTable(); }
  else if (t.id === "fag"){ S.aging = Math.max(1, Number(t.value) || 30); try { localStorage.setItem("agingDays", S.aging); } catch (er) {} renderTab(); }
  else if (t.id === "lp"){ S.f.lp = t.value; renderTab(); }
  else if (t.id === "lk"){ S.f.lk = t.value; renderTab(); }
  else if (t.dataset && t.dataset.g){
    const g = (S.staged[+t.dataset.fi] || {}).groups; if (!g) return; const grp = g[+t.dataset.gi];
    if (t.dataset.g === "tax") grp.taxType = t.value;
    else if (t.dataset.g === "ow") grp.overwrite = t.checked;
    else if (t.dataset.g === "term") grp.lines[+t.dataset.li].term_date = t.value;
    else if (t.dataset.g === "rate") grp.lines[+t.dataset.li].rate_pct = t.value === "" ? null : Number(t.value);
    else if (t.dataset.g === "phone"){ const m = maskPhone(t.value); if (t.value.trim() && !m) toast("연락처 형식을 확인해 주세요. (예: 010-5555-1234)", true); grp.lines[+t.dataset.li].phone = m; t.value = m; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "notebody"){ S.noteDraft[S.sel.partner] = e.target.value; return; }
  if (e.target.id === "q"){ S.f.q = e.target.value; $("#ovTable").innerHTML = overviewTable(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ const c = $("#celebrate"); if (c && c.innerHTML){ closeCelebrate(); return; } }
  if (e.target.id === "evnote"){ if (e.key === "Enter"){ const b = document.querySelector('[data-act="evsave"]'); if (b) b.click(); } else if (e.key === "Escape"){ S.editEv = 0; renderTab(); } return; } if (e.key === "Enter" && (e.target.id === "lpw" || e.target.id === "lem")){ const b = document.querySelector('[data-act="login"]'); if (b) b.click(); } });
document.addEventListener("focusout", () => { setTimeout(() => { if (S.dirty) safeRender(); }, 200); });
boot();

</script>
</body>
</html>
